packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]

  # Lints the project's own structure: layer violations, missing tests and docs,
  # unused models, rejoined upstream concepts. Range is policy, package-lock.yml
  # records the resolution. Pinned to the current major: an upper bound of
  # "<1.0.0" resolved to 0.14.3 and dbt reported 1.3.4 was available — a
  # too-conservative ceiling keeps you on an old major silently.
  - package: dbt-labs/dbt_project_evaluator
    version: [">=1.3.0", "<2.0.0"]
