version: 2

sources:
  - name: cfpb                        # what you type in source('cfpb', ...)
    description: "Raw CFPB complaint extracts, loaded by ingest/load_cfpb.py (full replace each run)."
    # database: deliberately omitted — it defaults to the target's database
    # (dev/ci/prod), so the same source definition works on all three targets.
    schema: raw                       # the PHYSICAL schema; defaults to the source NAME if omitted
    loader: "python (requests, CSV export)"
    loaded_at_field: _loaded_at       # stamped by the loader; freshness is measured from this
    freshness:                        # source-level default, inherited by all tables
      warn_after: {count: 26, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: complaints              # what you type in source('cfpb', 'complaints')
        identifier: cfpb_complaints   # the PHYSICAL table name, since it differs from name
        description: >
          One row per consumer complaint filed with the CFPB. Raw column names come
          straight from the CSV export (spaces and all); staging renames them.
          Narrative column is dropped at load time.
        freshness:                    # table-level override wins over source-level
          warn_after: {count: 26, period: hour}
          error_after: {count: 72, period: hour}
          filter: '"Date received" >= current_date - interval 400 day'
        columns:
          - name: "Complaint ID"
            quote: true               # name contains a space, so tests must quote it
            description: "CFPB-assigned identifier. Unique per complaint."
            data_tests:
              - unique
              - not_null
